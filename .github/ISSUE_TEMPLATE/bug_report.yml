name: Fehler melden
description: Etwas funktioniert nicht wie erwartet
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Danke für die Meldung! Sicherheitslücken bitte **nicht** hier, sondern privat melden (siehe SECURITY.md).
        Bitte keine privaten Daten, Passwörter oder Tokens posten.
  - type: textarea
    id: beschreibung
    attributes:
      label: Was ist passiert?
      description: Und was hättest du stattdessen erwartet?
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: Schritte zum Nachvollziehen
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Docker-Tag (z. B. v0.7.0) oder Commit
  - type: dropdown
    id: umgebung
    attributes:
      label: Wo tritt es auf?
      multiple: true
      options: [Handy, Desktop, Server / Docker, Suchagent / Portal]
  - type: textarea
    id: logs
    attributes:
      label: Logs oder Screenshots
      description: Gern Server-Log-Ausschnitte (ohne Zugangsdaten).
